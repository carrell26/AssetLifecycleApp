<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filters for glows and 3D shadows -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="bubble-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F203C" flood-opacity="0.5" />
    </filter>

    <!-- Gradients for Pedestals -->
    <linearGradient id="ped-left-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223E63" />
      <stop offset="100%" stop-color="#152B47" />
    </linearGradient>
    <linearGradient id="ped-left-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102035" />
      <stop offset="100%" stop-color="#081220" />
    </linearGradient>
    <linearGradient id="ped-right-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3353" />
      <stop offset="100%" stop-color="#0D1B2E" />
    </linearGradient>

    <!-- Center Tall Pedestal -->
    <linearGradient id="ped-center-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ped-center-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#03487A" />
    </linearGradient>
    <linearGradient id="ped-center-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#053358" />
    </linearGradient>

    <!-- Glowing Turquoise Layer Plate -->
    <linearGradient id="plate-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="plate-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Purple 3D Cube -->
    <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Left Blue Speech Bubble -->
    <linearGradient id="bubble-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Right Magenta/Plum Speech Bubble -->
    <linearGradient id="bubble-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="40%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Shield Green Gradient -->
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- =========================================================
       CONNECTING DASHED ARCS (Audit Hash Chain Data Links)
       ========================================================= -->
  <path d="M 125 55 C 150 35, 175 35, 195 48" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.65" filter="url(#glow-cyan)" />
  <path d="M 225 48 C 245 35, 270 35, 295 55" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" opacity="0.65" filter="url(#glow-cyan)" />

  <!-- Particle Dots on Arcs -->
  <circle cx="160" cy="38" r="2.5" fill="#E0F2FE" filter="url(#glow-cyan)" />
  <circle cx="260" cy="38" r="2.5" fill="#E0F2FE" filter="url(#glow-cyan)" />

  <!-- =========================================================
       NODE 1: LEFT NODE (Code Symbol Bubble on Dark Pedestal)
       ========================================================= -->
  <g transform="translate(60, 20)">
    <!-- 3D Pedestal Base -->
    <!-- Top Face -->
    <polygon points="40,90 80,70 40,50 0,70" fill="url(#ped-left-top)" />
    <!-- Left Face -->
    <polygon points="0,70 40,90 40,135 0,115" fill="url(#ped-left-side)" />
    <!-- Right Face -->
    <polygon points="40,90 80,70 80,115 40,135" fill="url(#ped-right-side)" />
    <!-- Pedestal Edge Highlights -->
    <path d="M 0 70 L 40 90 L 80 70" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.3" />

    <!-- 3D Blue Speech Bubble with </> -->
    <g transform="translate(10, 0)" filter="url(#bubble-shadow)">
      <!-- Bubble Body -->
      <rect x="0" y="5" width="60" height="60" rx="18" fill="url(#bubble-blue)" />
      <!-- Tail Pointer -->
      <polygon points="20,60 30,73 34,60" fill="#1E40AF" />
      <polygon points="20,60 30,73 30,60" fill="#2563EB" />
      
      <!-- Top Gloss Highlight -->
      <path d="M 8 10 C 18 7, 42 7, 52 10 C 56 11, 57 14, 55 17 C 45 22, 15 22, 5 17 C 3 14, 4 11, 8 10 Z" fill="#FFFFFF" opacity="0.25" />

      <!-- Code Symbol: < / > -->
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- < -->
        <polyline points="20,27 13,35 20,43" />
        <!-- / -->
        <line x1="27" y1="44" x2="33" y2="26" />
        <!-- > -->
        <polyline points="40,27 47,35 40,43" />
      </g>
    </g>
  </g>

  <!-- =========================================================
       NODE 2: CENTER NODE (Active Ledger - Purple Cube & Cyan Plate)
       ========================================================= -->
  <g transform="translate(170, 5)">
    <!-- 3D Tall Main Pedestal -->
    <!-- Top Face -->
    <polygon points="40,82 80,62 40,42 0,62" fill="url(#ped-center-top)" />
    <!-- Left Face -->
    <polygon points="0,62 40,82 40,148 0,128" fill="url(#ped-center-left)" />
    <!-- Right Face -->
    <polygon points="40,82 80,62 80,128 40,148" fill="url(#ped-center-right)" />
    <!-- Pedestal Crease Highlights -->
    <path d="M 0 62 L 40 82 L 80 62" stroke="#BAE6FD" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="40" y1="82" x2="40" y2="148" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Layered Glowing Mint / Turquoise Platform -->
    <g transform="translate(0, 16)" filter="url(#glow-cyan)">
      <!-- Step 1 (Bottom Plate) -->
      <polygon points="40,68 76,50 40,32 4,50" fill="#047857" opacity="0.6" />
      <!-- Step 2 (Middle Glow Plate) -->
      <polygon points="40,65 74,48 40,31 6,48" fill="url(#plate-glow)" />
      <polygon points="6,48 40,65 40,68 6,51" fill="#065F46" />
      <polygon points="40,65 74,48 74,51 40,68" fill="#047857" />
      <!-- Step 3 (Top Highlight) -->
      <polygon points="40,63 71,47 40,31 9,47" fill="url(#plate-cyan)" />
    </g>

    <!-- Floating Purple Cube with Shuffle 🔀 Icon -->
    <g transform="translate(14, 5)" filter="url(#bubble-shadow)">
      <!-- Top Face -->
      <polygon points="26,26 52,13 26,0 0,13" fill="url(#cube-top)" />
      <!-- Left Face -->
      <polygon points="0,13 26,26 26,52 0,39" fill="url(#cube-left)" />
      <!-- Right Face -->
      <polygon points="26,26 52,13 52,39 26,52" fill="url(#cube-right)" />

      <!-- Cube Edge Highlights -->
      <path d="M 0 13 L 26 26 L 52 13" stroke="#E9D5FF" stroke-width="1.2" stroke-opacity="0.6" />
      <line x1="26" y1="26" x2="26" y2="52" stroke="#E9D5FF" stroke-width="1" stroke-opacity="0.4" />

      <!-- Crossover / Shuffle Arrows 🔀 on Front Right Face -->
      <g transform="translate(29, 24) skewY(-26) scale(0.85)" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Top Curve to Arrow -->
        <path d="M 2 4 C 8 4, 12 14, 18 14" />
        <polyline points="15,11 18,14 15,17" fill="none" />
        <!-- Bottom Curve to Arrow -->
        <path d="M 2 14 C 8 14, 12 4, 18 4" />
        <polyline points="15,1 18,4 15,7" fill="none" />
      </g>
    </g>
  </g>

  <!-- =========================================================
       NODE 3: RIGHT NODE (Shield Check Bubble on Dark Pedestal)
       ========================================================= -->
  <g transform="translate(280, 20)">
    <!-- 3D Pedestal Base -->
    <!-- Top Face -->
    <polygon points="40,90 80,70 40,50 0,70" fill="url(#ped-left-top)" />
    <!-- Left Face -->
    <polygon points="0,70 40,90 40,135 0,115" fill="url(#ped-left-side)" />
    <!-- Right Face -->
    <polygon points="40,90 80,70 80,115 40,135" fill="url(#ped-right-side)" />
    <!-- Pedestal Edge Highlights -->
    <path d="M 0 70 L 40 90 L 80 70" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.3" />

    <!-- 3D Magenta/Plum Speech Bubble with Shield -->
    <g transform="translate(10, 0)" filter="url(#bubble-shadow)">
      <!-- Bubble Body -->
      <rect x="0" y="5" width="60" height="60" rx="18" fill="url(#bubble-purple)" />
      <!-- Tail Pointer -->
      <polygon points="26,60 30,73 40,60" fill="#701A75" />
      <polygon points="26,60 30,73 30,60" fill="#86198F" />

      <!-- Top Gloss Highlight -->
      <path d="M 8 10 C 18 7, 42 7, 52 10 C 56 11, 57 14, 55 17 C 45 22, 15 22, 5 17 C 3 14, 4 11, 8 10 Z" fill="#FFFFFF" opacity="0.25" />

      <!-- Emerald Green Shield with Checkmark -->
      <g transform="translate(15, 17)">
        <!-- Shield Body -->
        <path d="M 15 2 L 27 7 C 27 18, 21 27, 15 30 C 9 27, 3 18, 3 7 Z" fill="url(#shield-grad)" stroke="#6EE7B7" stroke-width="1.5" />
        <!-- Inner Shield Highlight -->
        <path d="M 15 5 L 24 9 C 24 17, 19 24, 15 26 Z" fill="#A7F3D0" opacity="0.3" />
        <!-- White Checkmark ✓ -->
        <polyline points="9,16 13,20 21,12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>
  </g>
</svg>
